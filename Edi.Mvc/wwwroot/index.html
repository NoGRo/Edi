<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EDI Player</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/player-vr.css">
<style>
    :root {
        color-scheme: dark;
        --edi-bg: #0d1117;
        --edi-surface: #161b22;
        --edi-surface-raised: #21262d;
        --edi-border: #30363d;
        --edi-border-strong: #57606a;
        --edi-text: #e6edf3;
        --edi-muted: #8b949e;
        --edi-primary: #58a6ff;
        --edi-primary-strong: #388bfd;
    }
    html, body { background: var(--edi-bg); color: var(--edi-text); }
    body { min-height: 100vh; }
    .card { background: var(--edi-surface); border-color: var(--edi-border); color: var(--edi-text); }
    .text-muted { color: var(--edi-muted) !important; }
    .form-select { border-color: var(--edi-border-strong); background-color: var(--edi-surface-raised); color: var(--edi-text); }
    .form-select:focus { border-color: var(--edi-primary); box-shadow: 0 0 0 .2rem rgba(88,166,255,.2); }
    .btn-outline-secondary { border-color: var(--edi-border-strong); color: #c9d1d9; }
    .btn-outline-secondary:hover,
    .btn-outline-secondary:focus-visible { border-color: #8b949e; background: var(--edi-surface-raised); color: #fff; }
    .intensity-zero-disabled { color: var(--bs-danger, #dc3545) !important; }
    .alert-secondary { border-color: var(--edi-border); background: var(--edi-surface-raised); color: var(--edi-text); }
    .alert-danger { border-color: #842029; background: #2d1418; color: #ffb3b8; }
    .player-shell { width: calc(100vw - 1.5rem); max-width: none; margin-left: 50%; transform: translateX(-50%); }
    .player-card .card-body { padding: .5rem; }
    .video-stage { position: relative; width: 100%; background: #010409; border-radius: .35rem; overflow: hidden; }
    .video-stage.video-empty { height: calc(100dvh - 8rem); min-height: 16rem; max-height: 75vh; }
    .player-video { display: block; width: 100%; max-height: 75vh; background: #010409; }
    .video-stage:fullscreen { display: flex; width: 100vw; height: 100vh; align-items: center; justify-content: center; border-radius: 0; background: #000; }
    .video-stage:fullscreen .player-video { width: 100%; height: 100%; max-height: none; object-fit: contain; }
    .custom-video-controls { position: absolute; z-index: 40; right: .75rem; bottom: .75rem; left: .75rem; padding: .55rem .65rem .45rem; border: 1px solid rgba(255,255,255,.14); border-radius: .55rem; background: linear-gradient(180deg, rgba(23,28,34,.82), rgba(12,15,18,.92)); color: #f8f9fa; box-shadow: 0 .35rem 1rem rgba(0,0,0,.3); opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(.35rem); transition: opacity .16s ease, transform .16s ease, visibility .16s ease; backdrop-filter: blur(7px); }
    .video-stage.controls-visible .custom-video-controls,
    .custom-video-controls:focus-within { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); }
    .custom-controls-row { display: flex; min-width: 0; align-items: center; gap: .55rem; }
    .custom-control-button { display: inline-flex; width: 2.15rem; height: 2.15rem; flex: 0 0 2.15rem; align-items: center; justify-content: center; padding: .25rem; border: 0; border-radius: .4rem; background: transparent; color: inherit; transition: color .12s ease, background-color .12s ease; }
    .custom-control-button:hover,
    .custom-control-button:focus-visible { background: rgba(255,255,255,.13); color: #8bb9ff; outline: none; }
    .custom-control-button:disabled { opacity: .4; }
    .custom-control-icon { width: 1.35rem; height: 1.35rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .custom-volume-control { display: flex; width: 2.15rem; min-width: 2.15rem; align-items: center; overflow: hidden; transition: width .18s ease; }
    .custom-volume-control:hover,
    .custom-volume-control:focus-within { width: 9rem; }
    .custom-volume-slider { --range-progress: 100%; width: 0; min-width: 0; margin: 0 .35rem 0 .25rem; opacity: 0; transition: width .18s ease, opacity .12s ease; }
    .custom-volume-control:hover .custom-volume-slider,
    .custom-volume-control:focus-within .custom-volume-slider { width: 6.15rem; opacity: 1; }
    .custom-time { flex: 0 0 auto; padding: .25rem .15rem; border: 0; border-radius: .3rem; background: transparent; color: rgba(255,255,255,.82); font-size: .78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .custom-time:hover,
    .custom-time:focus-visible { background: rgba(255,255,255,.1); color: #fff; outline: none; }
    .progress-mode-indicator { display: none; }
    .custom-progress-mode[data-mode="none"] .progress-mode-none,
    .custom-progress-mode[data-mode="video"] .progress-mode-video,
    .custom-progress-mode[data-mode="playlist"] .progress-mode-playlist { display: initial; }
    .custom-controls-spacer { min-width: 0; flex: 1 1 auto; }
    .custom-seek-slider { --range-progress: 0%; display: block; width: 100%; height: .85rem; margin: .25rem 0 0; cursor: pointer; }
    .custom-video-controls input[type="range"] { height: 1rem; appearance: none; -webkit-appearance: none; background: transparent; }
    .custom-video-controls input[type="range"]::-webkit-slider-runnable-track { height: .24rem; border-radius: 999px; background: linear-gradient(to right, #6ea8fe 0 var(--range-progress), rgba(255,255,255,.25) var(--range-progress) 100%); }
    .custom-video-controls input[type="range"]::-webkit-slider-thumb { width: .85rem; height: .85rem; margin-top: -.305rem; border: 2px solid #d8e8ff; border-radius: 50%; appearance: none; -webkit-appearance: none; background: #6ea8fe; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
    .custom-video-controls input[type="range"]::-moz-range-track { height: .24rem; border-radius: 999px; background: rgba(255,255,255,.25); }
    .custom-video-controls input[type="range"]::-moz-range-progress { height: .24rem; border-radius: 999px; background: #6ea8fe; }
    .custom-video-controls input[type="range"]::-moz-range-thumb { width: .7rem; height: .7rem; border: 2px solid #d8e8ff; border-radius: 50%; background: #6ea8fe; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
    .custom-video-controls input[type="range"]:focus-visible { outline: 2px solid rgba(110,168,254,.7); outline-offset: 2px; }
    .discrete-progress { position: absolute; z-index: 35; right: 0; bottom: 0; left: 0; height: .24rem; overflow: hidden; opacity: 0; pointer-events: none; transition: opacity .16s ease; }
    .discrete-progress-value { display: block; width: 0; height: 100%; background: rgba(110,168,254,.58); }
    .discrete-playlist-progress span { position: absolute; top: 0; bottom: 0; }
    .discrete-playlist-overlap { left: 0; background: linear-gradient(to bottom, rgba(110,168,254,.58) 0 50%, rgba(254,196,110,.62) 50% 100%); }
    .discrete-playlist-tail { width: 0; }
    .video-stage.progress-video:not(.controls-visible) .discrete-video-progress,
    .video-stage.progress-playlist:not(.controls-visible) .discrete-playlist-progress { opacity: 1; }
    .video-stage:has(.custom-video-controls:focus-within) .discrete-progress { opacity: 0; }
    .video-stage:fullscreen .custom-video-controls { right: 1rem; bottom: 1rem; left: 1rem; }
    .devices-grid { display: grid; grid-template-columns: 1fr; gap: .45rem; }
    .device-card.dragging { opacity: .45; }
    .device-drag-handle { cursor: grab; flex-shrink: 0; }
    .device-drag-handle:active { cursor: grabbing; }
    .auto-variant-dialog { max-width: min(90vw, 28rem); color: var(--edi-text); background: var(--edi-surface-raised); border: 1px solid var(--edi-border); border-radius: .45rem; padding: 1rem; }
    .auto-variant-dialog::backdrop { background: rgba(0,0,0,.6); }
    .device-card { min-width: 0; border: 1px solid var(--edi-border); border-radius: .45rem; background: var(--edi-surface-raised); padding: .4rem .5rem; }
    .device-card .form-label { margin-bottom: .15rem; color: var(--edi-muted); font-size: .75rem; line-height: 1.1; }
    .file-drop { border: 2px dashed var(--edi-border-strong); }
    .file-drop.drag-over { border-color: var(--edi-primary); background: rgba(56,139,253,.12); }
    .video-side-panel { position: absolute; z-index: 70; top: .75rem; width: min(34rem, calc(50% - 1.125rem)); max-height: calc(100% - 5.5rem); min-width: 0; padding: .75rem; overflow-x: hidden; overflow-y: auto; border: 1px solid var(--edi-border); border-radius: .55rem; background: rgba(22,27,34,.96); box-shadow: 0 .5rem 1.5rem rgba(0,0,0,.55); backdrop-filter: blur(9px); }
    .video-side-panel[hidden] { display: none; }
    .playlist-panel { left: .75rem; }
    .devices-panel { right: .75rem; }
    .workspace-panel-header { display: flex; align-items: center; justify-content: space-between; gap: .75rem; min-height: 2.35rem; }
    .workspace-panel-title { min-width: 0; }
    .playlist-panel-actions { position: relative; display: flex; align-items: center; gap: .4rem; flex: 0 0 auto; }
    .playlist-secondary-actions { display: flex; gap: .4rem; }
    .devices-panel .workspace-panel-content { margin-top: .75rem; }
    @media (max-width: 900px) {
        .video-side-panel { width: min(34rem, calc(100% - 1.5rem)); }
    }
    .playlist { list-style: none; min-height: 3rem; padding: 0; margin: .75rem 0 0; border-top: 1px solid var(--edi-border); }
    .playlist.playlist-scroll { max-height: 30rem; overflow-y: auto; scrollbar-gutter: stable; }
    .playlist-item { position: relative; display: flex; align-items: center; gap: .5rem; min-height: 2.7rem; padding: .35rem .5rem; border-bottom: 1px solid var(--edi-border); cursor: pointer; }
    .playlist-item:last-child { border-bottom: 0; }
    .playlist-item.active { background: rgba(56,139,253,.18); }
    .playlist-item.dragging { opacity: .45; }
    .playlist-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .playlist-duration { width: 7rem; flex: 0 0 7rem; text-align: right; font-variant-numeric: tabular-nums; }
    .playlist-item-actions { display: flex; flex: 0 0 0; gap: .3rem; overflow: hidden; opacity: 0; visibility: hidden; pointer-events: none; transform: translateX(.25rem); transition: flex-basis .14s ease, opacity .12s ease, transform .12s ease, visibility .12s ease; }
    .playlist-item:hover .playlist-item-actions,
    .playlist-item:focus-within .playlist-item-actions { flex-basis: 2rem; opacity: 1; visibility: visible; pointer-events: auto; transform: translateX(0); }
    .playlist-item-actions .icon-button { width: 2rem; height: 2rem; }
    .playlist-total { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .35rem .75rem; padding: .45rem .5rem 0; overflow-x: hidden; border-top: 1px solid var(--edi-border); font-size: 1rem; font-weight: 600; }
    .playlist-total-item { display: inline-flex; flex: 0 0 auto; align-items: baseline; gap: .2rem; white-space: nowrap; }
    .playlist-total .playlist-duration { width: auto; min-width: 3.25rem; flex: 0 0 auto; text-align: left; }
    .playlist-total-item:last-child .playlist-duration { width: 7rem; min-width: 7rem; flex-basis: 7rem; margin-right: .5rem; text-align: right; }
    .icon-button { display: inline-flex; align-items: center; justify-content: center; width: 2.35rem; height: 2.35rem; padding: .35rem; }
    .player-controls { display: flex; flex-wrap: nowrap; justify-content: space-between; gap: .75rem; align-items: center; }
    .player-toolbar { display: flex; min-width: 0; flex: 0 0 auto; align-items: center; gap: .5rem; }
    .player-toolbar .player-option-group { display: flex; flex: 0 0 auto; }
    .player-option { display: inline-flex; align-items: center; justify-content: center; min-width: 3rem; height: 2.5rem; }
    .player-option-group .player-option { width: 3rem; min-width: 3rem; flex: 0 0 3rem; }
    .player-option-icon { width: 1.55rem; height: 1.55rem; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    .icon-button .utility-icon { width: 1.45rem; height: 1.45rem; stroke-width: 2; }
    .player-option-icon .icon-fill { fill: currentColor; stroke: none; }
    .loop-mode-indicator { fill: currentColor; stroke: none; font: 700 7px sans-serif; text-anchor: middle; }
    .stroker-slash { opacity: 0; transition: opacity .15s ease; }
    .stroker-paused .stroker-slash { opacity: 1; }
    .device-range-effective { position: absolute; inset: 50% .625rem auto; height: .5rem; transform: translateY(-50%); background: linear-gradient(to right, transparent 0 var(--effective-low), #6ea8fe var(--effective-low) var(--effective-high), transparent var(--effective-high) 100%); border-radius: 999px; pointer-events: none; }
    .device-range-effective::before, .device-range-effective::after { content: ''; position: absolute; top: -.1rem; width: 2px; height: .7rem; background: #b6d4fe; transform: translateX(-50%); }
    .device-range-effective::before { left: var(--effective-low); }
    .device-range-effective::after { left: var(--effective-high); }
    .device-range-center { top: -.8rem !important; z-index: 4; }
    .device-range-center::-webkit-slider-thumb { width: .85rem !important; height: .85rem !important; margin-top: -.175rem !important; border-color: #b6d4fe !important; border-radius: 2px !important; transform: rotate(45deg); }
    .device-range-center::-moz-range-thumb { width: .65rem !important; height: .65rem !important; border-color: #b6d4fe !important; border-radius: 2px !important; transform: rotate(45deg); }
    .device-range { --range-low: 0%; --range-high: 100%; position: relative; height: 1.55rem; }
    .device-range-track { position: absolute; inset: 50% .625rem auto; height: .5rem; transform: translateY(-50%); border-radius: 999px; background: linear-gradient(to right, var(--edi-border) 0 var(--range-low), #415976 var(--range-low) var(--range-high), var(--edi-border) var(--range-high) 100%); }
    .device-range-input { position: absolute; inset: 0; width: 100%; height: 1.55rem; margin: 0; padding: 0; appearance: none; -webkit-appearance: none; background: transparent; pointer-events: none; }
    .device-range-input::-webkit-slider-runnable-track { height: .5rem; background: transparent; }
    .device-range-input::-webkit-slider-thumb { width: 1.25rem; height: 1.25rem; margin-top: -.375rem; border: 2px solid var(--edi-primary-strong); border-radius: 50%; appearance: none; -webkit-appearance: none; background: var(--edi-surface-raised); box-shadow: 0 1px 3px rgba(0,0,0,.45); cursor: grab; pointer-events: auto; }
    .device-range-input::-moz-range-track { height: .5rem; background: transparent; }
    .device-range-input::-moz-range-thumb { width: 1rem; height: 1rem; border: 2px solid var(--edi-primary-strong); border-radius: 50%; background: var(--edi-surface-raised); box-shadow: 0 1px 3px rgba(0,0,0,.45); cursor: grab; pointer-events: auto; }
    .device-range-input:focus-visible::-webkit-slider-thumb { outline: 3px solid rgba(13,110,253,.3); outline-offset: 2px; }
    .device-range-input:focus-visible::-moz-range-thumb { outline: 3px solid rgba(13,110,253,.3); outline-offset: 2px; }
    .variant-toggle-wrap { position: relative; z-index: 1090; display: flex; min-width: 0; flex: 0 0 auto; }
    .variant-toggle-button { line-height: 1; }
    .variant-toggle-button .variant-toggle-icon { width: 1.9rem; height: 1.9rem; stroke-width: 2.8; }
    .variant-toggle-button.variant-toggle-partially-stopped .variant-toggle-icon { color: var(--bs-danger); }
    .variant-toggle-panel { position: absolute; z-index: 1091; top: calc(100% + .4rem); right: 0; width: min(32rem, calc(100vw - 2rem)); padding: .85rem; border: 1px solid var(--edi-border); border-radius: .5rem; background: var(--edi-surface-raised); box-shadow: 0 .5rem 1rem rgba(0,0,0,.4); }
    .variant-toggle-panel[hidden] { display: none; }
    .variant-panel-close { position: absolute; top: .55rem; right: .55rem; width: 1.5rem; height: 1.5rem; padding: .15rem; }
    .variant-panel-close .utility-icon { width: 1rem; height: 1rem; }
    .variant-toggle-status { min-height: 1.25rem; }
    button[data-tooltip] { position: relative; }
    button[data-tooltip]::before,
    button[data-tooltip]::after { position: absolute; left: 50%; z-index: 1080; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .12s ease, transform .12s ease, visibility .12s ease; }
    button[data-tooltip]::before { content: ""; bottom: calc(100% + .25rem); width: .55rem; height: .55rem; background: #010409; transform: translate(-50%, .2rem) rotate(45deg); }
    button[data-tooltip]::after, .player-tooltip { width: max-content; max-width: calc(100vw - 1rem); padding: .4rem .6rem; border: 1px solid var(--edi-border); border-radius: .4rem; background: #010409; color: var(--edi-text); box-shadow: 0 .2rem .65rem rgba(0,0,0,.45); font-size: .75rem; font-weight: 500; line-height: 1.25; text-align: center; white-space: normal; }
    button[data-tooltip]::after { content: attr(data-tooltip); bottom: calc(100% + .5rem); transform: translate(-50%, .2rem); }
    .player-tooltip { position: fixed; inset: auto; margin: 0; overflow: visible; pointer-events: none; white-space: pre-line; }
    .player-tooltip::before { content: ''; position: absolute; top: -.3rem; left: var(--tooltip-arrow, 50%); width: .55rem; height: .55rem; background: #010409; transform: translateX(-50%) rotate(45deg); }
    button[data-tooltip]:hover::before,
    button[data-tooltip]:hover::after,
    button[data-tooltip]:focus-visible::before,
    button[data-tooltip]:focus-visible::after { opacity: 1; visibility: visible; }
    button[data-tooltip]:hover::before,
    button[data-tooltip]:focus-visible::before { transform: translate(-50%, 0) rotate(45deg); }
    button[data-tooltip]:hover::after,
    button[data-tooltip]:focus-visible::after { transform: translate(-50%, 0); }
    button[data-tooltip]:hover::before,
    button[data-tooltip]:hover::after { transition-delay: .45s; }
    button[data-tooltip].tooltip-align-left::after { right: auto; left: 0; transform: translate(0, .2rem); }
    button[data-tooltip].tooltip-align-left:hover::after,
    button[data-tooltip].tooltip-align-left:focus-visible::after { transform: translate(0, 0); }
    button[data-tooltip].tooltip-align-right::after { right: 0; left: auto; transform: translate(0, .2rem); }
    button[data-tooltip].tooltip-align-right:hover::after,
    button[data-tooltip].tooltip-align-right:focus-visible::after { transform: translate(0, 0); }
    .video-stage.fullscreen-cursor-hidden,
    .video-stage.fullscreen-cursor-hidden * { cursor: none !important; }
    .video-stage.fullscreen-cursor-visible { cursor: default; }
    .fullscreen-device-controls { width: max-content; }
    .fullscreen-device-controls .variant-toggle-panel { top: calc(100% + .55rem); }
    .device-meta-line { display: flex; min-width: 0; gap: .4rem; align-items: center; }
    .device-control-buttons { margin-left: auto; flex-shrink: 0; }
    .device-control-buttons .icon-button { width: 2rem; height: 2rem; padding: .3rem; }
    .device-meta-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .device-status-dot { width: .55rem; height: .55rem; flex: 0 0 .55rem; border-radius: 50%; background: var(--bs-secondary); }
    .device-status-dot.connected { background: var(--bs-success); box-shadow: 0 0 .45rem rgba(25,135,84,.55); }
    .device-variants { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: .25rem; margin-top: .35rem; }
    .device-variant-field { position: relative; min-width: 0; }
    .device-variant-field::after { content: attr(data-tooltip); position: absolute; z-index: 7; left: 50%; bottom: calc(100% + .3rem); padding: .2rem .42rem; border: 1px solid var(--edi-border); border-radius: .3rem; background: #010409; color: var(--edi-text); font-size: .68rem; font-weight: 600; opacity: 0; pointer-events: none; transform: translate(-50%, .2rem); transition: opacity .12s ease, transform .12s ease; white-space: nowrap; }
    .device-variant-field:hover::after,
    .device-variant-field:focus-within::after { opacity: 1; transform: translate(-50%, 0); }
    .device-variants .form-select { min-width: 0; padding-top: .2rem; padding-bottom: .2rem; font-size: .75rem; }
    .device-variant-switch { width: 1.65rem; height: auto; min-height: 1.75rem; padding: .15rem; align-self: stretch; }
    .device-variant-switch .utility-icon { width: .9rem; height: .9rem; }
    .device-variants .device-variant-active { border-color: var(--edi-primary); box-shadow: 0 0 0 .16rem rgba(88,166,255,.28); }
    .device-variants .device-variant-stopped { border-color: var(--bs-danger); box-shadow: 0 0 0 .16rem rgba(220,53,69,.28); }
    .device-range-field { position: relative; margin-top: .15rem; padding-top: .65rem; }
    .panel-toggle[aria-expanded="true"] { border-color: var(--edi-primary); background: rgba(56,139,253,.18); color: var(--edi-text); }
    .fullscreen-control-surface { padding: .7rem 1rem; border-radius: .45rem; background: rgba(0,0,0,.65); color: #fff; backdrop-filter: blur(4px); }
    .fullscreen-playback-overlay { position: absolute; z-index: 70; inset: 0 auto 0 0; width: 5rem; display: none; padding: 12px 0 0 12px; align-items: flex-start; }
    .video-stage:fullscreen .fullscreen-playback-overlay { display: flex; }
    .video-stage:fullscreen #playFullscreen,
    .video-stage:fullscreen #stopPlayer { display: none; }
    .fullscreen-playback-overlay .player-toolbar { width: max-content; opacity: 0; visibility: hidden; transform: translateX(-.45rem); transition: opacity .18s ease, transform .18s ease, visibility .18s ease; }
    .video-stage:fullscreen .fullscreen-playback-overlay.visible .player-toolbar { opacity: 1; visibility: visible; transform: translateX(0); }
    .video-stage:fullscreen .video-side-panel { top: 4.9rem; width: min(34rem, calc(50vw - 1.15rem)); max-height: calc(100vh - 10rem); border-color: rgba(255,255,255,.18); background: rgba(12,15,18,.94); opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-.35rem); transition: opacity .18s ease, transform .18s ease, visibility .18s ease; }
    .video-stage:fullscreen .fullscreen-playback-overlay.visible ~ .video-side-panel { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); }
    .video-stage:fullscreen .devices-grid { grid-template-columns: 1fr; }
</style>
</head>
<body>
<main class="container pb-3">

<div class="player-shell" tabindex="-1">
    <h1 class="h3 mb-3">EDI Player</h1>

    <div class="card player-card mb-4">
        <div class="card-body">
            <input id="mediaFiles" class="visually-hidden" type="file" multiple>
            <div class="player-controls mb-2">
                <div id="playbackToolbar" class="player-toolbar player-toolbar-playback">
                <button id="playFullscreen" class="btn btn-success icon-button" type="button" aria-label="Play in fullscreen" data-tooltip="Play in fullscreen">
                    <svg class="player-option-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" /></svg>
                </button>
                <button id="stopPlayer" class="btn btn-danger icon-button" type="button" aria-label="Stop playback" data-tooltip="Stop playback">
                    <svg class="player-option-icon" viewBox="0 0 24 24" aria-hidden="true"><rect class="icon-fill" x="6" y="6" width="12" height="12" rx="1" /></svg>
                </button>
                <div class="btn-group player-option-group" role="group" aria-label="Playback options">
                    <button id="autoplayToggle" class="btn btn-outline-secondary player-option" type="button"
                            aria-pressed="false" aria-label="Autoplay" data-tooltip="Autoplay">
                        <svg class="player-option-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path class="icon-fill" d="M3.5 5.2a1 1 0 0 1 1.5-.85l10.2 6.8a1 1 0 0 1 0 1.7L5 19.65a1 1 0 0 1-1.5-.85z" />
                            <path d="M19 5v14" />
                        </svg>
                    </button>
                    <button id="loopToggle" class="btn btn-outline-secondary player-option" type="button"
                            aria-pressed="false" aria-label="Repeat off" data-tooltip="Repeat off">
                        <svg class="player-option-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M18.5 8A7 7 0 0 0 6.5 5.5L4 8M4 4v4h4M5.5 16A7 7 0 0 0 17.5 18.5L20 16M20 20v-4h-4" />
                            <text id="loopModeIndicator" class="loop-mode-indicator" x="12" y="14.5"></text>
                        </svg>
                    </button>
                    <button id="resumeToggle" class="btn btn-outline-secondary player-option" type="button"
                            aria-pressed="false" aria-label="Resume from last position" data-tooltip="Resume from the last position">
                        <svg class="player-option-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 3h12v18l-6-4-6 4z" />
                            <path class="icon-fill" d="M10 8l5 3-5 3z" />
                        </svg>
                    </button>
                    <button id="playlistPanelToggle" class="btn btn-outline-secondary player-option panel-toggle" type="button"
                            aria-expanded="true" aria-controls="fileDrop" aria-label="Hide playlist" data-tooltip="Playlist">
                        <svg class="player-option-icon utility-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle class="icon-fill" cx="4.5" cy="6" r="1.25" /><circle class="icon-fill" cx="4.5" cy="12" r="1.25" /><circle class="icon-fill" cx="4.5" cy="18" r="1.25" />
                            <path d="M8 6h12M8 12h12M8 18h12" />
                        </svg>
                    </button>
                    <button id="vrSettingsToggle" class="btn btn-outline-secondary player-option" type="button" aria-expanded="false" aria-controls="vrSettings" aria-label="Immersive video settings" data-tooltip="Immersive video settings">
                        <svg class="player-option-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6" /></svg>
                    </button>
                </div>
                </div>
                <div class="player-toolbar player-toolbar-device">
                <div class="variant-toggle-wrap">
                    <div class="btn-group player-option-group" role="group" aria-label="Device controls">
                    <button id="strokerToggle" class="btn btn-outline-secondary player-option" type="button"
                            aria-pressed="false" aria-label="Click or Space: pause playback" data-tooltip="Click or Space: pause playback">
                        <svg class="player-option-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="7" y="2.5" width="10" height="19" rx="5" />
                            <path d="M12 6v12M9.5 8.5L12 6l2.5 2.5M9.5 15.5L12 18l2.5-2.5" />
                            <path class="stroker-slash" d="M3.5 3.5l17 17" style="stroke-width: 3.5" />
                        </svg>
                    </button>
                    <button id="intensityToggle" class="btn btn-outline-secondary player-option" type="button"
                            aria-pressed="false" aria-label="Mouse wheel: adjust intensity" data-tooltip="Mouse wheel: adjust intensity">
                        <svg class="player-option-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <!-- Four vertical bars of increasing height -->
                            <rect x="4" y="8" width="2" height="12" rx="0.5" />
                            <rect x="9" y="6" width="2" height="14" rx="0.5" />
                            <rect x="14" y="4" width="2" height="16" rx="0.5" />
                            <rect x="19" y="2" width="2" height="18" rx="0.5" />
                        </svg>
                    </button>
                    <button id="variantToggle" class="btn btn-outline-secondary player-option variant-toggle-button" type="button"
                            aria-pressed="false" aria-expanded="false" aria-controls="variantTogglePanel"
                            aria-label="Right click to switch device variant" data-tooltip="Right click to switch device variant">
                        <svg class="player-option-icon variant-toggle-icon" viewBox="0 0 28 24" aria-hidden="true">
                            <path d="M4 12h20M8 8l-4 4 4 4M20 8l4 4-4 4" />
                        </svg>
                    </button>
                    <button id="devicesPanelToggle" class="btn btn-outline-secondary player-option panel-toggle" type="button"
                            aria-expanded="true" aria-controls="devicesPanel" aria-label="Hide devices" data-tooltip="Devices">
                        <svg class="player-option-icon utility-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
                    </button>
                    </div>
                    <div id="variantTogglePanel" class="variant-toggle-panel" hidden>
                        <button id="closeVariantPanel" class="btn btn-sm btn-outline-secondary icon-button variant-panel-close" type="button" aria-label="Close variant selection">
                            <svg class="player-option-icon utility-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
                        </button>
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label" for="primaryVariant">Default primary</label>
                                <select id="primaryVariant" class="form-select"></select>
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="secondaryVariant">Default secondary</label>
                                <select id="secondaryVariant" class="form-select"></select>
                            </div>
                        </div>
                        <div id="variantToggleStatus" class="variant-toggle-status small text-muted mt-2"></div>
                    </div>
                </div>
                </div>
            </div>
            <div id="videoStage" class="video-stage video-empty">
                <video id="videoPlayer" class="player-video" preload="auto"></video>
                <div id="fullscreenPlaybackOverlay" class="fullscreen-playback-overlay"></div>
                <section id="fileDrop" class="file-drop video-side-panel playlist-panel">
                    <div class="workspace-panel-header">
                        <div class="d-flex align-items-center gap-2">
                            <strong>Playlist</strong>
                            <span id="playlistCount" class="small text-muted">0 videos</span>
                        </div>
                        <div class="playlist-panel-actions">
                            <button id="addMediaFiles" class="btn btn-sm btn-primary icon-button" type="button"
                                    aria-label="Add multiple videos and assets" data-tooltip="Choose multiple files">
                                <svg class="player-option-icon utility-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15" /></svg>
                            </button>
                            <button id="clearPlaylist" class="btn btn-sm btn-outline-danger icon-button" type="button"
                                    aria-label="Clear the playlist" data-tooltip="Clear the playlist">
                                <svg class="player-option-icon utility-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h17M9 6.5V4h6v2.5M6.5 6.5l1 13h9l1-13M10 10v6M14 10v6" /></svg>
                            </button>
                        </div>
                    </div>
                    <div class="small text-muted mt-1">Choose multiple files or drop videos and assets here.</div>
                    <ol id="videoPlaylist" class="playlist" aria-label="Video playlist">
                        <li class="p-3 text-muted">You have not added videos yet.</li>
                    </ol>
                    <div class="playlist-total">
                        <span class="playlist-total-item">
                            <span>Total playback:</span>
                            <span id="totalPlayback" class="playlist-duration">0:00</span>
                        </span>
                        <span class="playlist-total-item">
                            <span>Total duration:</span>
                            <span id="playlistDurationTotal" class="playlist-duration">0:00</span>
                        </span>
                    </div>
                </section>
                <section id="devicesPanel" class="video-side-panel devices-panel">
                    <div class="workspace-panel-header"><strong>Devices</strong></div>
                    <div id="devicesGrid" class="devices-grid">
                        <div class="text-muted">Looking for devices...</div>
                    </div>
                </section>
                <div class="discrete-progress discrete-video-progress" aria-hidden="true"><span id="discreteVideoProgress" class="discrete-progress-value"></span></div>
                <div class="discrete-progress discrete-playlist-progress" aria-hidden="true">
                    <span id="discretePlaylistOverlap" class="discrete-playlist-overlap"></span>
                    <span id="discretePlaylistTail" class="discrete-playlist-tail"></span>
                </div>
                <div id="customVideoControls" class="custom-video-controls" role="group" aria-label="Video controls">
                    <div class="custom-controls-row">
                        <button id="customPlayPause" class="custom-control-button" type="button" aria-label="Play">
                            <svg class="custom-control-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path id="customPlayIcon" d="M7 4.5v15l12-7.5z" />
                                <path id="customPauseIcon" d="M8 5v14M16 5v14" />
                            </svg>
                        </button>
                        <div class="custom-volume-control">
                            <button id="customMute" class="custom-control-button" type="button" aria-label="Mute">
                                <svg class="custom-control-icon" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M5 9h4l5-4v14l-5-4H5z" />
                                    <path id="customVolumeWaves" d="M17 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11" />
                                    <path id="customVolumeSlash" d="M17 9l5 6M22 9l-5 6" />
                                </svg>
                            </button>
                            <input id="customVolume" class="custom-volume-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
                        </div>
                        <button id="customTime" class="custom-time" type="button" aria-label="Show remaining time" aria-pressed="false"><span id="customElapsed">0:00</span> / <span id="customDuration">0:00</span></button>
                        <button id="customProgressMode" class="custom-control-button custom-progress-mode" type="button" data-mode="none" aria-label="Persistent progress hidden" title="Persistent progress hidden">
                            <svg class="custom-control-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M3 12s3.5-7 9-7 9 7 9 7-3.5 7-9 7-9-7-9-7z" />
                                <path class="progress-mode-indicator progress-mode-none" d="M5 5l14 14" />
                                <circle class="progress-mode-indicator progress-mode-video" cx="12" cy="12" r="2.5" />
                                <path class="progress-mode-indicator progress-mode-playlist" d="M8.5 9.5h7M8.5 12h7M8.5 14.5h7" />
                            </svg>
                        </button>
                        <button id="vrFollowToggle" class="custom-control-button" type="button" hidden aria-pressed="false" aria-label="Lock screen to gaze" title="Lock screen to gaze">
                            <svg class="custom-control-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="5" y="10" width="14" height="11" rx="2" />
                                <path class="vr-lock-closed" d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
                                <path class="vr-lock-open" d="M8 10V7a4 4 0 0 1 7.4-2.1M12 14v3" />
                            </svg>
                        </button>
                        <span class="custom-controls-spacer"></span>
                        <button id="enterVr" class="custom-control-button" type="button" hidden aria-pressed="false" aria-label="Enter VR" title="Enter VR">
                            <svg class="custom-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16l2 12h-6l-4-4-4 4H2z" /><circle cx="7" cy="11" r="2" /><circle cx="17" cy="11" r="2" /></svg>
                        </button>
                        <button id="customFullscreen" class="custom-control-button" type="button" aria-label="Enter fullscreen">
                            <svg class="custom-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" /></svg>
                        </button>
                    </div>
                    <input id="customSeek" class="custom-seek-slider" type="range" min="0" max="0" step="0.01" value="0" aria-label="Video position">
                </div>
            </div>
        </div>
    </div>

</div>
</main>
<script src="/js/player-tools.js"></script>
<script type="module" src="/js/edi-player.js?v=20260928-immersive-player"></script>
<script src="/js/edi-devices.js?v=20260928-device-routing"></script>
</body>
</html>
