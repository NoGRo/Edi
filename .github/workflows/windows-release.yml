name: Windows release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "master"
  push:
    branches:
      - "master"
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\Edi.sln --nologo

      - name: Test
        run: >-
          dotnet test .\Edi.Core.Tests\Edi.Core.Tests.csproj
          --configuration Release
          --framework net8.0
          --no-restore
          --nologo

      - name: Publish self-contained Windows build
        shell: pwsh
        run: >-
          .\scripts\Publish-Windows.ps1
          -Configuration Release
          -OutputDirectory "${{ runner.temp }}\Edi-win-x64"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Edi-win-x64
          path: ${{ runner.temp }}\Edi-win-x64\Edi.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $executablePath = Join-Path "${{ runner.temp }}" "Edi-win-x64\Edi.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $executablePath --clobber
          } else {
            gh release create `
              $tag `
              $executablePath `
              --generate-notes `
              --title "EDI $tag"
          }
